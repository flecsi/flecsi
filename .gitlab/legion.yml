mpich-legion-ucx-defaults:
  stage: Legion backend
  extends: [.darwin_regular_job, .build_and_test]
  variables:
    SPACK_ENV_NAME: legion/ucx/serial/mpich-gcc-defaults

mpich-legion-ucx-gnu:
  stage: Legion backend
  extends: [.darwin_regular_job, .build_and_test]
  variables:
    SPACK_ENV_NAME: legion/ucx/serial/mpich-gcc-debug
    ARCHIVE_SPACK_ENV: "yes"

mpich-legion-ucx-gnu:release:
  stage: Legion backend
  extends: [.darwin_release_job, .build_and_test]
  variables:
    SPACK_ENV_NAME: legion/ucx/serial/mpich-gcc-release

openmpi-legion-ucx-openmp-gnu:
  stage: Legion backend
  extends: [.darwin_regular_job, .build_and_test]
  variables:
    SPACK_ENV_NAME: legion/ucx/openmp/openmpi-gcc-debug
    ARCHIVE_SPACK_ENV: "yes"

openmpi-legion-ucx-openmp-gnu:release:
  stage: Legion backend
  extends: [.darwin_release_job, .build_and_test]
  variables:
    SPACK_ENV_NAME: legion/ucx/openmp/openmpi-gcc-release

openmpi-legion-ucx-cuda-clang:
  stage: Legion backend
  extends: [.darwin_regular_job, .build_and_test]
  variables:
    SPACK_ENV_NAME: legion/ucx/cuda/openmpi-volta-clang-debug
    PARTITIONS: volta-x86
    JOB_CONSTRAINTS: "${V100_CONSTRAINT}"
    ARCHIVE_SPACK_ENV: "yes"

openmpi-legion-gasnet-mpi-cuda-clang:
  stage: Legion backend
  extends: [.darwin_regular_job, .build_and_test]
  variables:
    SPACK_ENV_NAME: legion/gasnet/cuda/openmpi-mpi-volta-clang-debug
    PARTITIONS: volta-x86
    JOB_CONSTRAINTS: "${V100_CONSTRAINT}"
    ARCHIVE_SPACK_ENV: "yes"

mpich-legion-ucx-cuda-clang:
  stage: Legion backend
  extends: [.darwin_regular_job, .build_and_test]
  variables:
    SPACK_ENV_NAME: legion/ucx/cuda/mpich-volta-clang-debug
    PARTITIONS: volta-x86
    JOB_CONSTRAINTS: "${V100_CONSTRAINT}"

openmpi-legion-gasnet-mpi-rocm:
  stage: Legion backend
  extends: [.darwin_regular_job, .build_and_test]
  variables:
    SPACK_ENV_NAME: legion/gasnet/rocm/openmpi-mpi-mi250-rocmcc-debug
    PARTITIONS: shared-gpu-amd-mi250
    JOB_CONSTRAINTS: ""
    ARCHIVE_SPACK_ENV: "yes"
